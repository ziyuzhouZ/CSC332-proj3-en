<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Fashion Store</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/pages/auth.css">
    <style>
        /* Admin login specific styles */
        .admin-login-bg {
            background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .admin-card {
            background: #fff;
            width: 400px;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .admin-card .logo {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .admin-card .logo::after {
            content: 'Admin Panel';
            position: absolute;
            top: 50%;
            right: 60px;
            transform: translateY(-50%);
            background: #ff4f4f;
            color: #fff;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .admin-card .logo img {
            max-width: 150px;
        }
        
        .admin-card h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #1a1a1a;
        }
        
        .admin-login-form .input-group {
            margin-bottom: 20px;
        }
        
        .admin-login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .admin-login-form input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .admin-login-form input:focus {
            border-color: #1a1a1a;
            outline: none;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.1);
        }
        
        .btn-admin-login {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn-admin-login:hover {
            background-color: #333;
        }
        
        .error-message {
            color: #ff4f4f;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        .admin-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .admin-links a {
            color: #ff4f4f;
            text-decoration: none;
        }
        
        .admin-links a:hover {
            text-decoration: underline;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="admin-login-bg">
    <div class="admin-card">
        <div class="logo">
            <img src="../../public/images/icons/logo.png" alt="Fashion Store">
        </div>
        <h1>Admin Login</h1>
        
        <form id="adminLoginForm" class="admin-login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-admin-login">
                <span>Login</span>
                <div class="loading-spinner"></div>
            </button>
            
            <div id="errorMessage" class="error-message"></div>
            
            <div class="admin-links">
                <a href="register.html">Register New Admin (Invitation Code Required)</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('adminLoginForm');
            const errorMessage = document.getElementById('errorMessage');
            const loadingSpinner = document.querySelector('.loading-spinner');
            
            // Check if already logged in
            const token = localStorage.getItem('admin_token');
            if (token) {
                // Already logged in, redirect to admin dashboard
                window.location.href = 'dashboard.html';
            }
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (!username || !password) {
                    showError('Please fill in all fields');
                    return;
                }
                
                // Show loading spinner
                loadingSpinner.style.display = 'block';
                errorMessage.style.display = 'none';
                loginForm.querySelector('button[type="submit"]').disabled = true;
                
                // Simulate API call
                setTimeout(() => {
                    // Get admin data from localStorage
                    const adminData = JSON.parse(localStorage.getItem('admin_data') || '{}');
                    
                    // Check credentials
                    if ((username === 'admin' && password === 'admin123') || 
                        (adminData.username === username && adminData.token)) {
                        // Login success
                        localStorage.setItem('admin_token', adminData.token || 'admin_token_default');
                        window.location.href = 'dashboard.html';
                    } else {
                        showError('Incorrect username or password');
                        loadingSpinner.style.display = 'none';
                        loginForm.querySelector('button[type="submit"]').disabled = false;
                    }
                }, 1500);
            });
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
