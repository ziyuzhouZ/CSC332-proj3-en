<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Fashion Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .error-container {
            text-align: center;
            padding: 100px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin: 0;
            color: #333;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0 40px;
            color: #666;
        }
        .home-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Sorry, the page you are looking for does not exist</p>
        <a href="/" class="home-button">Return to Home</a>
    </div>

    <script>
        // Log 404 error
        console.error('Page not found:', window.location.pathname);
    </script>
</body>
</html>
