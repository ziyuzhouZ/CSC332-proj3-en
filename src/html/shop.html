<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Fashion Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/pages/shop.css">
    <style>
        /* Toast message styles */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .toast {
            background-color: var(--white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 200px;
            animation: fadeIn 0.3s;
        }
        
        .toast.success i {
            color: var(--success-color);
        }
        
        .toast.error i {
            color: var(--error-color);
        }
        
        .toast.hide {
            animation: fadeOut 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" aria-label="Menu">
                    <span>Men</span>
                    <span>Women</span>
                    <span>Accessories</span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li>
                        <a href="shop.html" class="dropdown-toggle">Categories</a>
                        <ul class="dropdown-menu">
                            <li><a href="shop.html?category=women">Women</a></li>
                            <li><a href="shop.html?category=men">Men</a></li>
                            <li><a href="shop.html?category=accessories">Accessories</a></li>
                        </ul>
                    </li>
                    <li><a href="about-pages/brand-story.html">Brand Story</a></li>
                </ul>
            </div>
            
            <div class="navbar-center">
                <a href="index.html" class="logo">
                    <img src="../public/images/icons/logo.png" alt="FASHION" class="logo-img">
                </a>
            </div>
            
            <div class="navbar-right">
                <div class="user-status">
                    <!-- User status will be dynamically generated by JS -->
                </div>
                <div class="nav-icons">
                    <a href="shop.html" class="icon-link">
                        <img src="../public/images/icons/shop.png" alt="Shop" class="icon">
                    </a>
                    <a href="cart.html" class="icon-link cart-icon">
                        <img src="../public/images/icons/cart.png" alt="Cart" class="icon">
                        <span class="cart-badge">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="shop-container">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>Gender</label>
                <div class="filter-options">
                    <button class="filter-option active" data-gender="all">All</button>
                    <button class="filter-option" data-gender="men">Men</button>
                    <button class="filter-option" data-gender="women">Women</button>
                </div>
            </div>

            <div class="filter-group">
                <label>Category</label>
                <div class="filter-options">
                    <button class="filter-option active" data-category="all">All</button>
                    <button class="filter-option" data-category="tops">Tops</button>
                    <button class="filter-option" data-category="bottoms">Bottoms</button>
                    <button class="filter-option" data-category="dresses">Dresses</button>
                    <button class="filter-option" data-category="outerwear">Outerwear</button>
                    <button class="filter-option" data-category="accessories">Accessories</button>
                </div>
            </div>

            <div class="filter-group">
                <label>Price</label>
                <div class="filter-options price-range">
                    <input type="number" id="minPrice" placeholder="Min">
                    <span>-</span>
                    <input type="number" id="maxPrice" placeholder="Max">
                    <button class="btn-apply">Apply</button>
                </div>
            </div>

            <div class="filter-group sort-group">
                <label>Sort</label>
                <select id="sortSelect">
                    <option value="default">Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="newest">Newest</option>
                    <option value="popular">Popular</option>
                </select>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="products-grid">
            <!-- Product Card Template -->
            <template id="productTemplate">
                <div class="product-card">
                    <div class="product-image">
                        <img src="" alt="" loading="lazy">
                        <button class="btn-quick-add">
                            <i class="icon-cart"></i>
                            <span>Add to Cart</span>
                        </button>
                        <button class="btn-favorite">
                            <i class="icon-heart"></i>
                        </button>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name"></h3>
                        <div class="product-price">
                            <span class="current-price"></span>
                            <span class="original-price"></span>
                            <span class="discount-tag"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination">
            <button class="btn-prev" disabled>
                <i class="icon-arrow-left"></i>
                Previous
            </button>
            <div class="page-numbers">
                <!-- Page numbers will be dynamically generated -->
            </div>
            <button class="btn-next">
                Next
                <i class="icon-arrow-right"></i>
            </button>
        </div>

        <!-- Loading Animation -->
        <div class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>
        
        <!-- Toast Container -->
        <div class="toast-container"></div>
    </main>

    <!-- Load cart module first, then shop page module -->
    <script type="module" src="../js/modules/cart.js"></script>
    <script type="module" src="../js/modules/shop.js"></script>
    
    <!-- Session Management -->
    <script type="module">
        import { updateNavbarUserStatus } from '../js/modules/auth/session.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Shop page loaded, updating user status');
            updateNavbarUserStatus();
        });
    </script>
</body>
</html>
