<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Fashion Store</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/pages/checkout.css">
    <style>
        /* Fix the checkout-container being covered by the navbar */
        .checkout-container {
            padding-top: 80px; /* Adjust based on navbar height */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <header class="header">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li>
                        <a href="shop.html" class="dropdown-toggle">Categories</a>
                        <ul class="dropdown-menu">
                            <li><a href="shop.html?category=women">Women</a></li>
                            <li><a href="shop.html?category=men">Men</a></li>
                            <li><a href="shop.html?category=accessories">Accessories</a></li>
                        </ul>
                    </li>
                    <li><a href="about-pages/brand-story.html">Brand Story</a></li>
                </ul>
            </div>
            
            <div class="navbar-center">
                <a href="index.html" class="logo">
                    <img src="../public/images/icons/logo.png" alt="FASHION" class="logo-img">
                </a>
            </div>
            
            <div class="navbar-right">
                <div class="user-status">
                    <!-- User status will be dynamically generated by JS -->
                </div>
                <div class="nav-icons">
                    <a href="shop.html" class="icon-link">
                        <img src="../public/images/icons/shop.png" alt="Shop" class="icon">
                    </a>
                    <a href="cart.html" class="icon-link cart-icon">
                        <img src="../public/images/icons/cart.png" alt="Cart" class="icon">
                        <span class="cart-badge">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="checkout-container">
        <!-- Checkout Progress -->
        <div class="checkout-progress" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
            <div class="progress-step active">
                <div class="step-number">1</div>
                <div class="step-text">Confirm Order</div>
            </div>
            <div class="progress-step">
                <div class="step-number">2</div>
                <div class="step-text">Payment</div>
            </div>
            <div class="progress-step">
                <div class="step-number">3</div>
                <div class="step-text">Complete</div>
            </div>
        </div>

        <!-- Shipping Address -->
        <section class="checkout-section" aria-labelledby="address-title">
            <h2 id="address-title">Shipping Address</h2>
            <div class="address-list" role="radiogroup" aria-label="Select shipping address"></div>
        </section>

        <!-- Product Information -->
        <section class="checkout-section" aria-labelledby="products-title">
            <h2 id="products-title">Product Information</h2>
            <div class="products-list" role="list" aria-label="Order product list"></div>
        </section>

        <!-- Coupons -->
        <section class="checkout-section" aria-labelledby="coupons-title">
            <h2 id="coupons-title">Coupons</h2>
            <div class="coupon-list" role="list" aria-label="Available coupons list"></div>
        </section>

        <!-- Amount Details -->
        <section class="checkout-section" aria-labelledby="amount-title">
            <h2 id="amount-title">Amount Details</h2>
            <div class="amount-details"></div>
        </section>

        <!-- Action Buttons -->
        <div class="checkout-actions">
            <a href="cart.html" class="btn-back" aria-label="Return to cart">Return to Cart</a>
            <button class="btn-submit" aria-label="Submit order">Submit Order</button>
        </div>
    </main>

    <!-- Add Address Modal -->
    <div id="addressModal" class="modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <h3 id="modal-title">Add New Address</h3>
            <form id="addressForm">
                <div class="form-group">
                    <label for="name">Recipient Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}">
                </div>
                <div class="form-group">
                    <label for="province">Province</label>
                    <select id="province" name="province" required></select>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <select id="city" name="city" required></select>
                </div>
                <div class="form-group">
                    <label for="district">District</label>
                    <select id="district" name="district" required></select>
                </div>
                <div class="form-group">
                    <label for="street">Detailed Address</label>
                    <textarea id="street" name="street" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- JavaScript -->
    <script type="module">
        import { checkoutManager } from '../js/modules/checkout.js';
        document.addEventListener('DOMContentLoaded', () => {
            checkoutManager.init();
        });
    </script>
</body>
</html>
