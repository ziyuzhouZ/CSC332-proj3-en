<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Center</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components/navbar.css">
    <link rel="stylesheet" href="../../css/pages/user-center/main.css">
    <link rel="stylesheet" href="../../css/pages/user-center/profile.css">
    <link rel="stylesheet" href="../../css/pages/user-center/orders/list.css">
    <link rel="stylesheet" href="../../css/pages/user-center/orders/detail.css">
    <style>
        .logout-button {
            margin-top: 20px;
            padding: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        #logout-btn {
            color: var(--error-color);
            cursor: pointer;
        }
        
        #logout-btn:hover {
            background-color: rgba(255, 0, 0, 0.05);
        }
        
        /* Fix content being covered by navigation bar */
        .user-center-container {
            padding-top: 80px; /* Adjusted according to navbar height */
            margin-top: 20px;
        }
    </style>
    
    <!-- Inline script to check login status -->
    <script>
        // Check login status when page loads
        window.addEventListener('DOMContentLoaded', function() {
            console.log('User center page loaded, checking login status');
            
            // Get login credentials from localStorage
            const token = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            const expiry = localStorage.getItem('session_expiry');
            
            console.log('Checking login status:', !!token, !!userData, !!expiry);
            
            // Redirect to login page if not logged in or session expired
            if (!token || !userData || !expiry || Date.now() > parseInt(expiry)) {
                console.log('Not logged in or session expired, redirecting to login page');
                alert('Please login first');
                window.location.href = '../auth/login.html';
                return;
            }
            
            try {
                // Display user information
                const user = JSON.parse(userData);
                console.log('Current logged in user:', user);
                
                // Update username display
                const usernameElement = document.querySelector('.username');
                if (usernameElement) {
                    usernameElement.textContent = user.username || 'User';
                    console.log('Username display updated');
                }
                
                // Directly bind logout button event
                const logoutBtn = document.getElementById('logout-btn');
                if (logoutBtn) {
                    console.log('Logout button found, adding click event');
                    logoutBtn.onclick = function() {
                        console.log('Logout button clicked');
                        if (confirm('Are you sure you want to log out?')) {
                            console.log('User confirmed logout');
                            // Clear session information from local storage
                            localStorage.removeItem('auth_token');
                            localStorage.removeItem('user_data');
                            localStorage.removeItem('session_expiry');
                            
                            console.log('Login information cleared, redirecting to homepage');
                            // Redirect to homepage
                            window.location.href = '../index.html';
                        }
                    };
                } else {
                    console.error('Logout button element not found');
                }
            } catch (error) {
                console.error('Error parsing user data:', error);
                alert('Invalid session, please login again');
                window.location.href = '../auth/login.html';
            }
        });
    </script>
</head>
<body>

                <button class="menu-toggle" aria-label="Menu">

                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>
                    <li>
                        <a href="../shop.html" class="dropdown-toggle">Categories</a>
                        <ul class="dropdown-menu">
                            <li><a href="../shop.html?category=women">Women's Clothing</a></li>
                            <li><a href="../shop.html?category=men">Men's Clothing</a></li>
                            <li><a href="../shop.html?category=accessories">Accessories</a></li>
                        </ul>
                    </li>
                    <li><a href="../about-pages/brand-story.html">Brand Story</a></li>
                </ul>
            </div>
            
            <div class="navbar-center">
                <a href="../index.html" class="logo">
                    <img src="../../public/images/icons/logo.png" alt="FASHION" class="logo-img">

            </div>
            
            <div class="navbar-right">

                    <!-- User status will be dynamically added by JavaScript -->

                <div class="nav-icons">
                    <a href="../shop.html" class="icon-link">

                    <a href="../cart.html" class="icon-link cart-icon">

    </header>

    <!-- User Center Main Content -->
    <div class="user-center-container">
        <!-- Left Navigation -->
        <div class="user-nav">

                    </button>
                </div>
                <h3 class="username">Username</h3>
                <p class="user-level">Regular Member</p>
            </div>
            
            <div class="user-menu">
                <div class="menu-item active" data-page="profile">
                    <i class="icon-user"></i>
                    <span>Profile</span>
                </div>
                <div class="menu-item" data-page="orders">

                    <span>My Orders</span>
                </div>
                <div class="menu-item" data-page="address">
                    <i class="icon-map-pin"></i>

                </div>
                <div class="menu-item" data-page="security">
                    <i class="icon-shield"></i>
                    <span>Account Security</span>
                </div>
                <div class="menu-item" data-page="notifications">
                    <i class="icon-bell"></i>
                    <span>Notifications</span>
                    <span class="badge">2</span>
                </div>
                
                <div class="menu-item">
                    <a href="../deals.html" style="display: flex; align-items: center; width: 100%; text-decoration: none; color: inherit;">
                        <i class="icon-gift"></i>
                        <span>Limited Time Offers</span>

                    </a>

                <div class="logout-button">

                        <i class="icon-log-out"></i>
                        <span>Log Out</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="user-content">
            <div class="content-header">
                <h1 class="page-title">Profile</h1>
                <div class="breadcrumb">
                    <span>User Center</span>
                    <i class="icon-arrow-right"></i>
                    <span>Profile</span>
                </div>
            </div>
            
            <div class="content-body" id="contentArea">
                <!-- Content will be dynamically loaded via JavaScript -->
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>
    
    <!-- Loading Animation -->
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    
    <!-- Toast Message Container -->
    <div class="toast-container"></div>

    <!-- Business Modules -->
    <script type="module" src="../../js/modules/cart.js"></script>
    <script type="module" src="../../js/modules/user/router.js"></script>
    <script type="module" src="../../js/modules/user/api.js"></script>
    <script type="module" src="../../js/modules/user/form.js"></script>
    <script type="module" src="../../js/modules/user/profile.js"></script>
    <script type="module" src="../../js/modules/user/orders.js"></script>
    <script type="module" src="../../js/modules/user/order-detail.js"></script>
    
    <!-- Session Management -->
    <script type="module">
        import { updateNavbarUserStatus } from '../../js/modules/auth/session.js';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('User center page loaded, updating navigation status');
            updateNavbarUserStatus();
        });
    </script>
</body>
