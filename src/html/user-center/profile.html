<!-- Profile Page -->
<div class="profile-container">
    <!-- Basic Information Card -->
    <div class="profile-card">
        <div class="card-header">
            <h3>Basic Information</h3>
            <button class="btn-edit" id="editProfileBtn">
                <i class="icon-edit"></i>
                <span>Edit</span>
            </button>
        </div>

        <!-- Personal Information Form -->
        <form id="profileForm" class="profile-form">
            <div class="form-group">
                <label for="avatar">Avatar</label>
                <div class="avatar-upload">
                    <img src="../../public/images/default-avatar.png" alt="User Avatar" id="avatarPreview">
                    <input type="file" id="avatarInput" name="avatar" accept="image/*" hidden>
                    <button type="button" class="btn-upload" id="uploadAvatarBtn">
                        <i class="icon-camera"></i>
                        <span>Change Avatar</span>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" disabled>
                </div>
                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" disabled>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" disabled>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" disabled>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" disabled>
                        <option value="">Private</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="birthday">Birthday</label>
                    <input type="date" id="birthday" name="birthday" disabled>
                </div>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="3" disabled></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" hidden>Save</button>
                <button type="button" class="btn-secondary" id="cancelEditBtn" hidden>Cancel</button>
            </div>
        </form>
    </div>

    <!-- Modification History Card -->
    <div class="profile-card">
        <div class="card-header">
            <h3>Modification History</h3>
        </div>
        <div class="history-list">
            <!-- History records will be dynamically added via JavaScript -->
        </div>
    </div>
</div>

<!-- Avatar Cropping Modal -->
<div class="modal" id="avatarModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Crop Avatar</h3>
            <button class="btn-close" id="closeAvatarModal">×</button>
        </div>
        <div class="modal-body">
            <div class="cropper-container">
                <!-- Image cropping area -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelCropBtn">Cancel</button>
            <button class="btn-primary" id="confirmCropBtn">Confirm</button>
        </div>
    </div>
</div>
